name: CommonRoad Package Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'packages/drawtonomy-commonroad/**'
      - '.github/workflows/commonroad-test.yml'

jobs:
  test:
    if: contains(github.event.pull_request.labels.*.name, 'run-tests')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No [checker] extra here: commonroad-drivability-checker publishes
      # manylinux_x86_64 wheels only and pulls a large dependency tree. The tests
      # that need it skip themselves, and everything else - the schema, the
      # no-checker paths, TraceWriter and the whole `open` server - still runs.
      - name: Install the package
        run: pip install -e "packages/drawtonomy-commonroad[test]"

      - name: Tests
        run: pytest packages/drawtonomy-commonroad
