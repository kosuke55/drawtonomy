name: Publish drawtonomy-commonroad

# Tag-driven release to PyPI via Trusted Publishing (OIDC, no API token).
#
#   git tag commonroad-v0.1.0 && git push origin commonroad-v0.1.0
#
# The tag version has to match [project].version in the package's pyproject.toml;
# a mismatch fails the build job before anything is uploaded.

on:
  push:
    tags:
      - 'commonroad-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/drawtonomy-commonroad

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the tag matches the package version
        run: |
          tag_version="${GITHUB_REF_NAME#commonroad-v}"
          pkg_version="$(python -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          ")"
          echo "tag=${tag_version} pyproject=${pkg_version}"
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match [project].version ${pkg_version} in pyproject.toml"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/drawtonomy-commonroad/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI trusts this repository + workflow + environment,
    # so no API token is stored anywhere.
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
